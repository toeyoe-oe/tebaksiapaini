<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Siapa Ini? - GP GPIB Mangngamaseang</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .zoom-target {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .lens-overlay {
            background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header Navigation -->
    <header class="w-full border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="app.showScreen('welcome')">
                <div class="bg-gradient-to-tr from-indigo-500 to-emerald-400 p-2.5 rounded-2xl shadow-lg">
                    <i data-lucide="zoom-in" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-black text-xl tracking-wider text-white">TEBAK SIAPA?</h1>
                    <p class="text-xs text-emerald-400 font-semibold tracking-widest uppercase">Gerakan Pemuda GPIB Mangngamaseang</p>
                </div>
            </div>

            <div id="nav-stats" class="hidden flex items-center gap-4 bg-slate-800/80 border border-slate-700 rounded-full px-4 py-1.5 text-sm">
                <div class="flex items-center gap-1.5 text-amber-400 font-bold">
                    <i data-lucide="trophy" class="w-4 h-4"></i>
                    <span id="nav-score">0</span>
                </div>
                <div class="h-4 w-[1px] bg-slate-700"></div>
                <div class="flex items-center gap-1.5 text-orange-400 font-bold">
                    <i data-lucide="zap" class="w-4 h-4"></i>
                    <span id="nav-streak">0x</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="app.toggleSound()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">
                    <i id="sound-icon" data-lucide="volume-2" class="w-5 h-5 text-slate-300"></i>
                </button>
                <button onclick="app.showScreen('welcome')" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">
                    <i data-lucide="home" class="w-5 h-5 text-slate-300"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 flex-1 flex flex-col justify-center items-center">

        <!-- ==================== SCREEN 1: LANDING & PIN ENTRY ==================== -->
        <section id="screen-welcome" class="w-full max-w-2xl space-y-8 animate-fadeIn">
            <!-- Kata Pengantar / Hero Banner -->
            <div class="text-center space-y-4 max-w-xl mx-auto pt-2">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold uppercase tracking-wider">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Game Seru After Ibadah GP
                </div>
                <h2 class="text-3xl md:text-5xl font-black tracking-tight text-white">
                    Seberapa Tajam <span class="bg-clip-text text-transparent bg-gradient-to-r from-emerald-40
